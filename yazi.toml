[mgr]
linemode       = "size"
sort_dir_first = true
sort_sensitive = false
show_symlink   = true

[tasks]
micro_workers = 10
macro_workers = 5

[preview]
max_width  = 1920
max_height = 1080

[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
run = "git"
