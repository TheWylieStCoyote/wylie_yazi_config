[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = ["c", "m"]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = "+"
run  = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on   = "-"
run  = "plugin zoom -1"
desc = "Zoom out hovered file"

[[mgr.prepend_keymap]]
on   = "<C-d>"
run  = "plugin diff"
desc = "Diff the selected with the hovered file"

[[mgr.prepend_keymap]]
on   = "<A-y>"
run  = "plugin copy-file-contents"
desc = "Copy contents of file"

[[mgr.prepend_keymap]]
on   = ["g", "i"]
run  = "plugin lazygit"
desc = "Open lazygit"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin max-preview"
desc = "Toggle full-screen preview"

[[mgr.prepend_keymap]]
on   = "f"
run  = "plugin jump-to-char"
desc = "Jump to file starting with typed character"

[[mgr.prepend_keymap]]
on   = ["m", "a"]
run  = "plugin bookmarks --args=save"
desc = "Save current directory as bookmark"

[[mgr.prepend_keymap]]
on   = "'"
run  = "plugin bookmarks --args=jump"
desc = "Jump to a saved bookmark"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter (persists when navigating into subdirectories)"
